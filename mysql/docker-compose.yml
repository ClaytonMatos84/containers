services:
    db:
        image: mysql:latest
        container_name: mysql
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        restart: unless-stopped
        networks:
            - int_mysql_network

volumes:
    db_data:

networks:
    int_mysql_network:
        driver: bridge