services:
    n8n:
        image: n8nio/n8n
        container_name: n8n
        ports:
            - "5678:5678"
        volumes:
            - ./volumes:/home/node/.n8n
            - ./n8n_output:/data/n8n_output
        environment:
            GENERIC_TIMEZONE: "America/Sao_Paulo"
            N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: true
            N8N_LISTEN_ADDRESS: "0.0.0.0"
            N8N_WORKER_SERVER_ADDRESS: "0.0.0.0"
            N8N_RESTRICT_FILE_ACCESS_TO: "/data/n8n_output"
            N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"

        restart: unless-stopped
        networks:
            - n8n_network

networks:
    n8n_network:
        driver: bridge