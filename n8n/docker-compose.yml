services:
    n8n:
        image: n8nio/n8n
        container_name: n8n
        ports:
            - "5678:5678"
        volumes:
            - ./volumes:/home/node/.n8n
        environment:
            GENERIC_TIMEZONE: "America/Sao_Paulo"
            N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: true
        restart: unless-stopped
        networks:
            - n8n_network

networks:
    n8n_network:
        driver: bridge